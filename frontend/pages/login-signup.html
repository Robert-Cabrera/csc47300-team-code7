<!--
    login.html

    This file contains the HTML structure for the login/signup page of NoteSmith.
    It includes a navigation bar and a container for login content.

    Frontend Finished, backend not complete or started yet, most of it will be done in js and supabase
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteSmith</title>
    <link rel="stylesheet" href="../stylesheets/style.css" />
    <script type="module" src="../scripts/script.js"></script>
  </head>

  <body>
    <div class="navigation-bar">
      <div class="nav-left">
        <a href="../index.html">
          <img src="../assets/NoteSmith_logo.png" alt="Logo" class="logo" />
        </a>
      </div>

      <div class="nav-center">
        <a href="crash_course.html">Crash Course</a>
        <a href="practice_tests.html">Practice Test</a>
        <a href="summary.html">Summary</a>
        <button id="theme-toggle" class="theme-toggle">Theme</button>
      </div>

      <div class="nav-right">
        <a href="#" id="loginBtn" class="login">Login/Sign Up</a>
      </div>
    </div>

    <div class="home-container">
      <section class="ls-section">
        <h1>Login or Sign Up to NoteSmith</h1>
        <p>
          Access your personalized study tools and notes by logging in or
          signing up.
        </p>

        <div class="auth-btns">
          <!-- Sign Up -->
          <button
            class="SignUpBtn"
            id="signUpBtn"
            aria-expanded="false"
            aria-controls="signupPanel"
          >
            Sign Up
          </button>
          <div
            id="signupPanel"
            class="auth-collapse"
            role="region"
            aria-labelledby="signUpBtn"
          >
            <h3>Create an account</h3>
            <form class="auth-form" id="signupForm" novalidate>
              <div class="auth-field">
                <label for="su-id">ID (username)</label>
                <input
                  id="su-id"
                  name="id"
                  type="text"
                  required
                  minlength="3"
                  autocomplete="username"
                />
              </div>
              <div class="auth-field">
                <label for="su-username">Username (name)</label>
                <input
                  id="su-username"
                  name="username"
                  type="text"
                  required
                  minlength="2"
                  autocomplete="name"
                />
              </div>
              <div class="auth-field">
                <label for="su-email">Email</label>
                <input
                  id="su-email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                />
              </div>
              <div class="auth-field">
                <label for="su-password">Password</label>
                <input
                  id="su-password"
                  name="password"
                  type="password"
                  required
                  minlength="8"
                  autocomplete="new-password"
                />
              </div>
              <div class="auth-actions">
                <button type="button" class="btn-ghost" id="signupCancel">
                  Cancel
                </button>
                <button type="submit" class="btn-primary">Sign Up</button>
              </div>
              <div class="auth-helper">
                By continuing you agree to our Terms & Privacy.
              </div>
            </form>
          </div>

          <!-- Login -->
          <button
            class="LoginBtn"
            id="loginBtnPage"
            aria-expanded="false"
            aria-controls="loginPanel"
          >
            Login
          </button>
          <div
            id="loginPanel"
            class="auth-collapse"
            role="region"
            aria-labelledby="loginBtnPage"
          >
            <h3>Log in</h3>
            <form class="auth-form" id="loginForm" novalidate>
              <div class="auth-field">
                <label for="li-identifier">Username or Email</label>
                <input
                  id="li-identifier"
                  name="identifier"
                  type="text"
                  required
                  autocomplete="username email"
                />
              </div>
              <div class="auth-field">
                <label for="li-password">Password</label>
                <input
                  id="li-password"
                  name="password"
                  type="password"
                  required
                  minlength="8"
                  autocomplete="current-password"
                />
              </div>
              <div class="auth-actions">
                <button type="button" class="btn-ghost" id="loginCancel">
                  Cancel
                </button>
                <button type="submit" class="btn-primary">Log In</button>
              </div>
              <div class="auth-error" id="loginError" hidden></div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>

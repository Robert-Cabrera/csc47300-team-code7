<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoteSmith – Practice Test</title>

  <link rel="stylesheet" href="../stylesheets/style.css" />

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script type="module" src="../scripts/script.js"></script>

</head>

<body>
  <!-- Navigation -->
  <div class="navigation-bar">
    <div class="nav-left">
      <a href="../index.html">
        <img src="../assets/NoteSmith_logo.png" alt="Logo" class="logo" />
      </a>
    </div>

    <div class="nav-center">
      <a href="./crash_course.html">Crash Course</a>
      <a class="active" aria-current="page" href="./practice_tests.html">Practice Test</a>
      <a href="./summary.html">Summary</a>
      <button id="theme-toggle" class="theme-toggle" type="button">Theme</button>
    </div>

    <div class="nav-right">
      <a href="#" id="loginBtn" class="login">Login/Sign Up</a>
    </div>
  </div>

  <!-- Main Container -->
  <div class="practice-test-container">
    <!-- Loading overlay -->
    <div id="pt-loading" class="practice_test_loading-overlay" aria-hidden="true">
      <div class="loading-animation-container">
        <div class="loading-spinner" role="progressbar" aria-label="Generating test"></div>
        <p>Generating your practice test…</p>
      </div>
    </div>


    <div id="test-locked" style="display:none;">
      <lottie-player src="../assets/lock_icon.json" background="transparent" speed="1"
        style="width:150px; height:150px; margin:auto;" loop autoplay></lottie-player>
      <p>You must be logged in to access Practice Tests.</p>
    </div>


    <div id="test-form">
      <header class="dashboard-header">
        <h2>Practice Test</h2>
        <p>Fill in your course and topic to generate a practice test.</p>
      </header>

      <form id="practiceTestForm" class="practice-test-form">
        <div class="form-group">
          <label for="practiceTestCourseInput">Course</label>
          <input type="text" id="practiceTestCourseInput" name="course" placeholder="e.g., Computer Organization" required />
        </div>

        <div class="form-group">
          <label for="practiceTestTopicInput">Topic</label>
          <input type="text" id="practiceTestTopicInput" name="topic" placeholder="e.g., Memory Hierarchy" required />
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Generate Test</button>
      </form>

      <!-- Error box (hidden until needed) -->
      <div id="pt-error" class="pt-error" style="display:none;"></div>

      <!-- Rendered test appears here -->
      <div id="pt-output" class="pt-output" style="display:none;"></div>
    </div>
  </div>
</body>
</html>
